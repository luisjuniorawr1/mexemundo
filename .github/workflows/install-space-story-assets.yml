name: Temporary Space Story Asset Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/missao-estrela-assets-hd
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and validate exact original kit
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/missao-estrela-perdida-hd.zip"
          python -m pip install --disable-pip-version-check --quiet gdown
          gdown --fuzzy 'https://drive.google.com/file/d/1AW0dKBrHgDkZpGeIZAuIZ5u1K7QHYOlp/view?usp=sharing' -O "$ZIP"
          echo "Downloaded bytes: $(stat -c%s "$ZIP")"
          sha256sum "$ZIP"
          test "$(stat -c%s "$ZIP")" = "80029968"
          echo '181e56952d0ae866825298b95b2e5bd360c617d8be3ee31b508a2b607484b3fa  '"$ZIP" | sha256sum -c -

      - name: Install and verify all 148 PNGs
        shell: bash
        run: |
          set -euo pipefail
          npm run assets:missao-estrela -- "$RUNNER_TEMP/missao-estrela-perdida-hd.zip"
          COUNT="$(find public/assets/missao-estrela-perdida -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Installed PNGs: $COUNT"
          test "$COUNT" = "148"
          du -sh public/assets/missao-estrela-perdida

      - name: Commit original assets to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/missao-estrela-perdida
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Adiciona assets HD originais da Missão Estrela Perdida'
          git push origin HEAD:agent/missao-estrela-assets-hd
