name: Apply motion navigation

on:
  push:
    paths:
      - .github/workflows/apply-motion-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch persistent room and motion cursor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          def patch_game_js(path, goalie=False):
              file = Path(path)
              text = file.read_text()
              text = replace_once(
                  text,
                  "import { RealtimeClient } from './realtime.js';",
                  "import { RealtimeClient } from './realtime.js';\nimport {\n  MotionCursor,\n  calibratedDeadZone,\n  getPersistentRoom,\n  roomHref\n} from './motion-ui.js';",
                  f'{path} imports'
              )
              text = replace_once(
                  text,
                  "const room = Math.random().toString(36).slice(2, 6).toUpperCase();",
                  "const room = getPersistentRoom();",
                  f'{path} persistent room'
              )
              text = replace_once(
                  text,
                  "const poseValue = document.querySelector('#poseValue');",
                  "const poseValue = document.querySelector('#poseValue');\nconst motionCursorElement = document.querySelector('#motionCursor');\nconst backButton = document.querySelector('#backButton');",
                  f'{path} cursor elements'
              )

              anchor = "const backgroundCtx = backgroundCanvas.getContext('2d', { alpha: false });"
              addition = anchor + "\nconst motionCursor = new MotionCursor({ element: motionCursorElement, dwellMs: 950, enabled: false });\nconst sessionDeadZone = Math.min(0.0065, calibratedDeadZone(0.004));\nbackButton.href = roomHref('/', room);"
              text = replace_once(text, anchor, addition, f'{path} cursor setup')

              set_state_old = "  scoreHud.classList.toggle('hidden', next !== 'playing');\n\n  if (next !== 'calibrating') {"
              set_state_new = "  scoreHud.classList.toggle('hidden', next !== 'playing');\n  motionCursor.setEnabled(phoneConnected && (next === 'calibrating' || next === 'result'));\n\n  if (next !== 'calibrating') {"
              text = replace_once(text, set_state_old, set_state_new, f'{path} cursor state')

              pose_old = "socket.on('pose', (data) => {\n  target = normalizePose(data);\n  posePackets += 1;\n});"
              pose_new = "socket.on('pose', (data) => {\n  target = normalizePose(data);\n  posePackets += 1;\n  if (state !== 'playing' && state !== 'countdown') motionCursor.updatePose(data);\n});"
              text = replace_once(text, pose_old, pose_new, f'{path} cursor pose')

              threshold_old = "const movementThreshold = speed < 0.14 ? 0.0032 : speed < 0.38 ? 0.0018 : 0.0008;"
              threshold_new = "const movementThreshold = speed < 0.14\n        ? Math.max(0.0032, sessionDeadZone)\n        : speed < 0.38\n          ? Math.max(0.0018, sessionDeadZone * 0.45)\n          : 0.0008;"
              text = replace_once(text, threshold_old, threshold_new, f'{path} calibrated dead zone')

              if goalie:
                  glove_old = "  const speed = Math.hypot(hand.vx, hand.vy);\n  ctx.rotate(clamp(hand.vx * 0.08, -0.25, 0.25));"
                  glove_new = "  const rawSpeed = Math.hypot(hand.vx, hand.vy);\n  const displaySpeed = rawSpeed >= 0.24 ? rawSpeed : 0;\n  const displayVx = Math.abs(hand.vx) >= 0.22 ? hand.vx : 0;\n  ctx.rotate(clamp(displayVx * 0.08, -0.25, 0.25));"
                  text = replace_once(text, glove_old, glove_new, 'goalkeeper stable glove rotation')
                  text = replace_once(
                      text,
                      "radius * (1 + Math.min(0.12, speed * 0.03))",
                      "radius * (1 + Math.min(0.12, displaySpeed * 0.03))",
                      'goalkeeper stable glove size'
                  )

              file.write_text(text)

          patch_game_js('public/js/tv.js')
          patch_game_js('public/js/goalkeeper.js', goalie=True)

          def patch_html(path, goalie=False):
              file = Path(path)
              text = file.read_text()
              if '<link rel="stylesheet" href="/motion.css" />' not in text:
                  marker = '<link rel="stylesheet" href="/goalkeeper.css" />' if goalie else '<link rel="stylesheet" href="/styles.css" />'
                  text = text.replace(marker, marker + '\n  <link rel="stylesheet" href="/motion.css" />', 1)

              body_class = 'tv-page goalkeeper-page' if goalie else 'tv-page'
              text = text.replace(f'<body class="{body_class}">', f'<body class="{body_class} motion-game-page">', 1)

              if goalie:
                  text = text.replace(
                      '<a class="icon-button home-button" href="/" aria-label="Voltar aos jogos">⌂</a>',
                      '<a id="backButton" class="icon-button home-button motion-back-button" href="/" data-motion-target aria-label="Voltar aos jogos">←</a>',
                      1
                  )
                  text = text.replace('<span class="eyebrow">AQUECIMENTO</span>', '<span class="eyebrow">PRONTO PARA JOGAR</span>', 1)
                  text = text.replace('<h2>Mostre as duas mãos e levante os braços</h2>', '<h2>Levante as duas mãos para começar</h2>', 1)
              else:
                  marker = '<div class="top-actions">'
                  text = text.replace(
                      marker,
                      marker + '\n      <a id="backButton" class="icon-button motion-back-button" href="/" data-motion-target aria-label="Voltar aos jogos">←</a>',
                      1
                  )
                  text = text.replace('<span class="eyebrow">PREPARAÇÃO</span>', '<span class="eyebrow">PRONTO PARA JOGAR</span>', 1)
                  text = text.replace('<h2>Mostre o corpo e levante as mãos</h2>', '<h2>Levante as duas mãos para começar</h2>', 1)

              text = text.replace(
                  'id="restartButton" class="button primary" type="button"',
                  'id="restartButton" class="button primary" data-motion-target type="button"',
                  1
              )

              cursor = '  <div id="motionCursor" class="motion-cursor" aria-hidden="true"><span>✋</span></div>\n'
              if 'id="motionCursor"' not in text:
                  text = text.replace('  <script type="module"', cursor + '  <script type="module"', 1)
              file.write_text(text)

          patch_html('public/tv.html')
          patch_html('public/goalkeeper.html', goalie=True)

          package_file = Path('package.json')
          package = json.loads(package_file.read_text())
          package['version'] = '0.8.0'
          package['scripts']['check'] = 'node --check server.js && node --check public/js/realtime.js && node --check public/js/motion-ui.js && node --check public/js/menu.js && node --check public/js/tv.js && node --check public/js/goalkeeper.js && node --check public/js/phone.js'
          package_file.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          server_file = Path('server.js')
          server = server_file.read_text()
          server = server.replace("version: '0.7.0'", "version: '0.8.0'", 1)
          server = server.replace(
              "games: ['balloons', 'goalkeeper'],",
              "games: ['balloons', 'goalkeeper'],\n      interaction: 'calibrated-hand-cursor',",
              1
          )
          server_file.write_text(server)
          PY

      - name: Validate JavaScript
        run: npm run check

      - name: Commit motion navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/tv.js public/js/goalkeeper.js public/tv.html public/goalkeeper.html package.json server.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add calibrated hand navigation"
          git push
